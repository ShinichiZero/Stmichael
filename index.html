<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="Interactive St. Michael prayer companion" />
    <title>St. Michael Defender</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>St. Michael Defender</h1>
      <div class="top-controls">
        <label for="languageSelect">Language</label>
        <select id="languageSelect" aria-label="Select language">
          <option value="en">English</option>
          <option value="la">Latin</option>
          <option value="it">Italian</option>
          <option value="de">German</option>
          <option value="ja">Japanese</option>
        </select>
        <button id="focusModeBtn" class="toggle-btn" aria-pressed="false">Focus mode</button>
        <button id="warfareModeBtn" class="toggle-btn" aria-pressed="false">Spiritual warfare mode</button>
      </div>
    </header>

    <main id="mainContent">
      <section class="controls">
        <div class="prayer-buttons" role="group" aria-label="Prayer selection">
          <button class="big-btn prayer-btn" data-prayer="prayer">Prayer to St. Michael</button>
          <button class="big-btn prayer-btn" data-prayer="chaplet">Chaplet of St. Michael</button>
          <button class="big-btn prayer-btn" data-prayer="litany">Litany</button>
        </div>

        <button id="panicBtn" class="panic-btn big-btn" aria-live="off">Spiritual Panic Button</button>
      </section>

      <section class="prayer-panel" aria-label="Prayer content">
        <div class="line-mode-controls">
          <button id="lineModeBtn" class="toggle-btn" aria-pressed="false">One line at a time</button>
          <button id="prevLineBtn" class="big-btn">Previous line</button>
          <button id="nextLineBtn" class="big-btn">Next line</button>
        </div>

        <article>
          <h2 id="prayerTitle">Prayer to St. Michael</h2>
          <p id="prayerLine" class="prayer-line" aria-live="polite"></p>
          <div id="allLines" class="all-lines" aria-live="polite"></div>
        </article>
      </section>

      <section class="chaplet-tools" aria-label="Chaplet tools">
        <h2>Bead Counter</h2>
        <div class="counter-row">
          <button id="decrementBtn" class="big-btn" aria-label="Decrease bead counter">-</button>
          <output id="beadCount" aria-live="polite">0</output>
          <button id="incrementBtn" class="big-btn" aria-label="Increase bead counter">+</button>
        </div>
        <button id="resetCounterBtn" class="big-btn">Reset beads</button>
      </section>
    </main>

    <audio id="ambience" loop preload="none"></audio>

    <div id="srStatus" class="sr-only" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
